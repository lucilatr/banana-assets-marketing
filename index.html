<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Banana Airways · Assets de marketing</title>
  <style>
    :root {
      --ink:      #1f2430;
      --ink-soft: #6b7280;
      --bg:       #ffffff;
      --panel:    #fafafa;
      --line:     #e6e6e2;
      --hecho:    #2fa360;  --hecho-bg: #eaf7ef;  --hecho-chip: #d7f0e0;  --hecho-line:#b9e4c8;
      --falta:    #a07a00;  --falta-chip:#fdf0cf;
      --revisar:  #5b53c7;  --revisar-chip:#e5e3fb;
      --actualizar:#c2560e; --actualizar-chip:#fde3d0;
      --p1:       #c0392b;  --p2:#b8860b;  --p3:#2b6cb0;
      --accent:   #ffd21e;
      --radius:   10px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.45; }
    a { color: var(--p3); }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 36px 28px 90px; }

    /* ---------- Header ---------- */
    .head-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 2rem; letter-spacing: -.02em; }
    .subtitle { margin: 8px 0 0; color: var(--ink-soft); font-size: .95rem; max-width: 820px; }

    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .lang-toggle { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; }
    .lang-toggle button { border: 0; background: #fff; color: var(--ink); font-weight: 700; font-size: .82rem;
      padding: 6px 12px; cursor: pointer; }
    .lang-toggle button.active { background: var(--ink); color: #fff; }
    .tool-btn { border: 1.5px solid var(--ink); background: #fff; color: var(--ink); font-weight: 700;
      font-size: .82rem; padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .tool-btn:hover { background: var(--panel); }
    .tool-btn.primary { background: var(--accent); }
    .tool-btn.primary:hover { background: #ffdf5a; }
    .save-indicator { border: 1.5px solid var(--line); border-radius: 8px; font-weight: 700; font-size: .82rem;
      padding: 6px 12px; cursor: pointer; white-space: nowrap; background: #fff; color: var(--ink-soft); }
    .save-indicator.pending { border-color: var(--falta);     color: var(--falta);     background: var(--falta-chip); }
    .save-indicator.saving  { border-color: var(--revisar);   color: var(--revisar);   background: var(--revisar-chip); }
    .save-indicator.saved   { border-color: var(--hecho-line);color: var(--hecho);     background: var(--hecho-chip); }
    .save-indicator.error   { border-color: #e0a0a0;          color: #c0392b;          background: #fde3e3; }

    /* ---------- Summary + legend ---------- */
    .summary { margin: 18px 0 6px; display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
    .chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .78rem;
      padding: 3px 10px; border-radius: 999px; }
    .chip.hecho     { background: var(--hecho-chip);     color: var(--hecho); }
    .chip.falta     { background: var(--falta-chip);     color: var(--falta); }
    .chip.revisar   { background: var(--revisar-chip);   color: var(--revisar); }
    .chip.actualizar{ background: var(--actualizar-chip);color: var(--actualizar); }
    .summary .cnt { color: var(--ink-soft); }
    /* fila de búsqueda + exportar */
    .toolrow { margin: 18px 0 4px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    .search-box { position: relative; display: inline-flex; align-items: center; width: 280px; max-width: 100%; }
    .search-ico { position: absolute; left: 11px; font-size: .9rem; opacity: .6; pointer-events: none; }
    #search-input { width: 100%; box-sizing: border-box; padding: 8px 32px 8px 34px; font: inherit; font-size: .9rem;
      border: 1.5px solid var(--line); border-radius: 999px; background: #fff; }
    #search-input:focus { outline: none; border-color: var(--ink); }
    .search-clear { position: absolute; right: 8px; border: 0; background: none; cursor: pointer; color: var(--ink-soft);
      font-size: .85rem; display: none; }
    .search-box.has .search-clear { display: inline; }

    /* barra de filtro (por estado / por persona) */
    .filterbar { margin: 8px 0 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: .85rem; font-weight: 700; color: var(--ink-soft); }
    .filter-seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
    .seg-btn { border: 0; background: #fff; color: var(--ink); font-weight: 700; font-size: .8rem;
      padding: 5px 14px; cursor: pointer; }
    .seg-btn.active { background: var(--ink); color: #fff; }
    .filter-options { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .filter-chip { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid transparent;
      font: inherit; font-size: .9rem; padding: 3px 7px; border-radius: 999px; cursor: pointer; }
    .filter-chip:hover { background: var(--panel); border-color: var(--line); }
    .filter-chip.off { opacity: .4; }
    .filter-chip.off .chip { text-decoration: line-through; }
    .filter-chip .eye { font-size: .72rem; }
    .person-chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1.5px solid var(--line);
      font: inherit; font-size: .82rem; padding: 3px 10px 3px 4px; border-radius: 999px; cursor: pointer; color: var(--ink); }
    .person-chip:hover { border-color: var(--ink-soft); }
    .person-chip.on { border-color: var(--ink); background: #fff7d6; font-weight: 700; }
    .filter-clear { border: 0; background: none; color: var(--p1); font-size: .8rem; font-weight: 700;
      cursor: pointer; text-decoration: underline; padding: 2px 4px; }
    .empty-filter { color: var(--ink-soft); font-style: italic; padding: 20px 2px; }

    .pri.P1 { color: var(--p1); } .pri.P2 { color: var(--p2); } .pri.P3 { color: var(--p3); }

    /* línea de tiempo / hoja de ruta */
    .timeline { margin: 18px 0 8px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 16px 18px; }
    .tl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .tl-title { font-weight: 800; font-size: 1rem; }
    .tl-prios { font-size: .82rem; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .pri-count { font-weight: 800; font-size: .78rem; padding: 2px 9px; border-radius: 999px; }
    .pri-count.p1 { color: var(--p1); background: #fae3e0; } .pri-count.p2 { color: var(--p2); background: #f6ecd0; }
    .pri-count.p3 { color: var(--p3); background: #ddeaf8; }

    .tl-track { position: relative; height: 34px; margin: 6px 6px 10px; border-top: 2px solid var(--line); }
    .tl-dot { position: absolute; top: -7px; width: 13px; height: 13px; border-radius: 50%;
      transform: translateX(-50%); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
    .tl-dot.demo   { background: var(--actualizar); }
    .tl-dot.press  { background: var(--p3); }
    .tl-dot.launch { background: var(--p1); width: 16px; height: 16px; top: -9px; }
    .tl-today { position: absolute; top: -2px; height: 20px; border-left: 2px dashed var(--ink);
      transform: translateX(-1px); }
    .tl-today span { position: absolute; top: 20px; left: -12px; font-size: .64rem; font-weight: 800;
      color: var(--ink); white-space: nowrap; }

    .tl-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .tl-item { display: flex; align-items: flex-start; gap: 10px; font-size: .88rem; padding-left: 14px; position: relative; }
    .tl-item::before { content: ""; position: absolute; left: 0; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); }
    .tl-item.demo::before   { background: var(--actualizar); }
    .tl-item.press::before  { background: var(--p3); }
    .tl-item.launch::before { background: var(--p1); }
    .tl-date { font-weight: 800; min-width: 54px; color: var(--ink); }
    .tl-label { color: var(--ink); }
    .tl-item.launch .tl-label { font-weight: 700; }
    .tl-tbd { display: inline-block; font-size: .64rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: .04em; color: var(--p1); background: #fae3e0; border-radius: 999px; padding: 1px 7px; margin-left: 4px; }

    /* ---------- Progress ---------- */
    .progress { margin: 14px 0 26px; }
    .progress-bar { height: 10px; background: #eee; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
    .progress-fill { height: 100%; width: 0; background: var(--hecho); transition: width .35s ease; }
    .progress-label { margin-top: 5px; font-size: .8rem; color: var(--ink-soft); font-weight: 600; }

    h2.sec-list { margin: 30px 0 10px; font-size: 1.4rem; }

    /* ---------- Section ---------- */
    .section { margin: 26px 0 0; }
    .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; cursor: pointer; user-select: none; }
    .section-caret { font-size: .7rem; color: var(--ink-soft); transition: transform .2s; }
    .section.collapsed .section-caret { transform: rotate(-90deg); }
    .section-title { font-size: .82rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
    .section-count { font-size: .72rem; font-weight: 700; color: var(--ink-soft); background: var(--panel);
      border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; }
    .folder-link { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: .76rem; font-weight: 700;
      text-decoration: none; color: var(--ink); background: var(--accent); border: 1.5px solid var(--ink);
      border-radius: 999px; padding: 3px 11px; white-space: nowrap; }
    .folder-link.empty { background: #fff; color: var(--ink-soft); border-style: dashed; border-color: var(--line); }

    .section.collapsed table { display: none; }

    /* ---------- Table ---------- */
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--ink-soft); font-weight: 700; padding: 6px 12px; border-bottom: 1px solid var(--line); }
    tbody td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tbody tr { transition: background .15s; }
    tbody tr.hecho { background: var(--hecho-bg); box-shadow: inset 4px 0 0 var(--hecho); }
    tbody tr:hover { background: var(--panel); }
    tbody tr.hecho:hover { background: #e2f3e9; }

    .col-estado { width: 124px; } .col-p { width: 62px; } .col-medida { width: 150px; } .col-links { width: 170px; }
    .col-dur { width: 96px; }

    /* status chip (clickeable) */
    .status-btn { border: 0; cursor: pointer; font-weight: 700; font-size: .74rem; padding: 4px 10px;
      border-radius: 6px; white-space: nowrap; }
    .status-btn.hecho     { background: var(--hecho-chip);     color: var(--hecho); }
    .status-btn.falta     { background: var(--falta-chip);     color: var(--falta); }
    .status-btn.revisar   { background: var(--revisar-chip);   color: var(--revisar); }
    .status-btn.actualizar{ background: var(--actualizar-chip);color: var(--actualizar); }
    .status-btn:not(:disabled):hover { outline: 2px solid rgba(0,0,0,.12); }
    .status-btn:disabled { cursor: default; }

    .opt-tag { display: inline-block; margin-left: 8px; font-size: .64rem; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; color: var(--ink-soft); background: var(--panel);
      border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; vertical-align: middle; }

    /* nota "qué actualizar" */
    .estado-cell { white-space: nowrap; }
    .note-btn { margin-right: 6px; vertical-align: middle; cursor: pointer; font-size: .82rem;
      line-height: 1; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line);
      background: #fff; color: var(--ink-soft); }
    .note-btn:hover { border-color: var(--ink); color: var(--ink); }
    .note-btn.has { border-color: var(--actualizar); background: var(--actualizar-chip); color: var(--actualizar); }
    .note-pop { position: fixed; z-index: 60; display: none; width: 270px; background: #fff;
      border: 1.5px solid var(--ink); border-radius: 12px; box-shadow: 0 10px 30px rgba(31,36,48,.2); padding: 12px; }
    .note-pop.open { display: block; }
    .note-pop-title { margin: 0 0 7px; font-size: .68rem; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase; color: var(--actualizar); }
    .note-pop textarea { width: 100%; min-height: 90px; box-sizing: border-box; resize: vertical;
      border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; font-size: .88rem; }
    .note-pop textarea[readonly] { background: var(--panel); }
    .note-pop-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 9px; }
    .note-pop-actions button { border: 1.5px solid var(--ink); background: #fff; border-radius: 8px;
      padding: 5px 13px; font-weight: 700; font-size: .8rem; cursor: pointer; }
    .note-pop-actions .save { background: var(--accent); }
    .note-pop-actions .save:hover { background: #ffdf5a; }

    /* asignación de personas */
    .assignees { display: flex; align-items: center; gap: 7px; margin-top: 7px; flex-wrap: wrap; }
    .assign-chips { display: inline-flex; gap: 3px; }
    .assign-chip { display: inline-flex; align-items: center; justify-content: center; width: 23px; height: 23px;
      border-radius: 50%; font-size: .62rem; font-weight: 800; color: #fff; flex-shrink: 0; }
    .assign-add { font-size: .72rem; font-weight: 700; color: var(--ink-soft); background: #fff;
      border: 1px dashed var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
    .assign-add:hover { border-color: var(--ink); color: var(--ink); }
    .assign-pop { position: fixed; z-index: 60; display: none; width: 236px; background: #fff;
      border: 1.5px solid var(--ink); border-radius: 12px; box-shadow: 0 10px 30px rgba(31,36,48,.2); padding: 10px; }
    .assign-pop.open { display: block; }
    .assign-pop-title { margin: 0 0 7px; font-size: .68rem; font-weight: 800; letter-spacing: .06em;
      text-transform: uppercase; color: var(--ink-soft); }
    .assign-opt { display: flex; align-items: center; gap: 9px; padding: 5px 4px; border-radius: 8px;
      cursor: pointer; font-size: .82rem; }
    .assign-opt:hover { background: var(--panel); }
    .assign-opt input { width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }

    td.p-cell { font-weight: 800; }
    .p-cell.P1 { color: var(--p1); } .p-cell.P2 { color: var(--p2); } .p-cell.P3 { color: var(--p3); }
    .p-select { font: inherit; font-weight: 800; font-size: .9rem; border: 1px solid var(--line);
      border-radius: 6px; padding: 3px 4px; cursor: pointer; background: #fff; }
    .p-select:hover { border-color: var(--ink); }
    .p-select.P1 { color: var(--p1); } .p-select.P2 { color: var(--p2); } .p-select.P3 { color: var(--p3); }

    .asset-title { font-weight: 700; margin: 0 0 2px; }
    .asset-note { color: var(--ink-soft); font-size: .88rem; margin: 0; }
    .dur { font-size: .85rem; color: var(--ink-soft); white-space: nowrap; }

    /* medida badges */
    .medida { display: flex; flex-wrap: wrap; gap: 5px; }
    .mbadge { font-size: .76rem; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
    .mbadge.dim { border: 1px dashed var(--p3); color: var(--p3); cursor: pointer; background: #f3f8fd; }
    .mbadge.dim:hover { background: #e4f0fb; }
    .mbadge.plain { color: var(--ink-soft); }

    /* links */
    .links { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
    .links a { font-size: .85rem; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .link-pending { font-size: .85rem; color: var(--ink-soft); background: none; border: 0; padding: 0;
      cursor: pointer; text-align: left; border-bottom: 1px dashed var(--ink-soft); }
    .link-custom { color: #0b7; }
    .add-link { margin-top: 2px; font-size: .78rem; color: var(--ink-soft); background: #fff;
      border: 1px dashed var(--line); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
    .add-link:hover { border-color: var(--ink); color: var(--ink); }
    .link-row { display: inline-flex; align-items: center; gap: 4px; }
    .link-edit { background: none; border: 0; cursor: pointer; color: var(--ink-soft); font-size: .8rem; padding: 0 2px; }

    /* ---------- Template modal ---------- */
    .modal-back { position: fixed; inset: 0; background: rgba(31,36,48,.55); display: none;
      align-items: center; justify-content: center; z-index: 50; padding: 24px; }
    .modal-back.open { display: flex; }
    .modal { background: #fff; border-radius: 14px; padding: 20px; max-width: 92vw; max-height: 88vh; overflow: auto; }
    .modal h3 { margin: 0 0 12px; font-size: 1rem; }
    .tpl-box { background: repeating-conic-gradient(#f0f0f0 0% 25%, #fff 0% 50%) 50% / 20px 20px;
      border: 2px solid var(--ink); position: relative; }
    .tpl-box span { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      font-weight: 800; color: var(--ink); background: rgba(255,255,255,.75); padding: 3px 8px; border-radius: 6px; }
    .modal-close { margin-top: 14px; border: 1.5px solid var(--ink); background: var(--accent); font-weight: 700;
      border-radius: 8px; padding: 6px 14px; cursor: pointer; }

    footer { margin-top: 42px; color: var(--ink-soft); font-size: .8rem; }
    footer .reset { background: none; border: 0; color: #c0392b; cursor: pointer; text-decoration: underline; padding: 0; font-size: .8rem; }

    @media (max-width: 760px) {
      .col-medida, .col-links { width: auto; }
      thead { display: none; }
      tbody td { display: block; border: none; padding: 3px 12px; }
      tbody tr { display: block; border-bottom: 1px solid var(--line); padding: 10px 0; }
    }

    /* ---------- Modo solo lectura ---------- */
    body.read .btn-publish-only,
    body.read #reset-btn,
    body.read .footer-edit-only { display: none; }

    /* ---------- Impresión / PDF ---------- */
    @media print {
      .toolbar, .lang-toggle, #reset-btn, .section-caret, .toolrow,
      .add-link, .link-pending, .link-edit, .folder-link.empty, .modal-back,
      .note-btn, .note-pop, .assign-add, .assign-pop, .filter-hint, .filter-chip .eye { display: none !important; }
      .wrap { max-width: none; padding: 0; }
      .section.collapsed table { display: table !important; }
      .section.collapsed .section-caret { display: none; }
      tbody tr { break-inside: avoid; }
      .p-select { border: none; background: none; padding: 0; -webkit-appearance: none; appearance: none; }
      tbody tr.hecho { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body { font-size: 12px; }
      a { color: var(--ink); text-decoration: none; }
      .status-btn, .chip, .mbadge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head-top">
      <div>
        <h1 id="site-title"></h1>
        <p class="subtitle" id="site-subtitle"></p>
      </div>
      <div class="toolbar">
        <div class="lang-toggle">
          <button data-lang="en" id="btn-en">EN</button>
          <button data-lang="es" id="btn-es">ES</button>
        </div>
        <button class="tool-btn" id="btn-pdf">🖨 PDF</button>
        <button class="tool-btn" id="btn-mode"></button>
        <button class="tool-btn primary" id="btn-publish">💾 Guardar</button>
      </div>
    </div>

    <div class="toolrow">
      <div class="search-box">
        <span class="search-ico">🔍</span>
        <input type="text" id="search-input" autocomplete="off" />
        <button class="search-clear" id="search-clear" title="Limpiar">✕</button>
      </div>
      <button class="tool-btn" id="btn-export"></button>
    </div>

    <div class="filterbar" id="filterbar"></div>

    <div class="progress">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label" id="progress-label"></div>
    </div>

    <div class="timeline" id="timeline"></div>

    <h2 class="sec-list" id="sec-list-title"></h2>
    <div id="sections"></div>

    <footer>
      <p id="footer-text"></p>
      <button class="reset" id="reset-btn"></button>
    </footer>
  </div>

  <div class="assign-pop" id="assign-pop">
    <p class="assign-pop-title" id="assign-pop-title"></p>
    <div id="assign-list"></div>
  </div>

  <div class="note-pop" id="note-pop">
    <p class="note-pop-title" id="note-pop-title"></p>
    <textarea id="note-text"></textarea>
    <div class="note-pop-actions">
      <button class="save" id="note-save"></button>
      <button id="note-cancel"></button>
    </div>
  </div>

  <div class="modal-back" id="modal-back">
    <div class="modal">
      <h3 id="modal-title"></h3>
      <div class="tpl-box" id="tpl-box"><span id="tpl-label"></span></div>
      <button class="modal-close" id="modal-close">Cerrar</button>
    </div>
  </div>

  <!-- Carga con "cache-busting": siempre trae la última versión, sin refrescar a mano -->
  <script>
    (function () {
      var bust = "?t=" + Date.now();
      document.write('<script src="config.js' + bust + '"><\/script>');
      document.write('<script src="app.js' + bust + '"><\/script>');
    })();
  </script>
